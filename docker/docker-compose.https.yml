# HTTPS (Let’s Encrypt на хосте — каталог /etc/letsencrypt монтируется в контейнер).
#
# Подготовка:
#   cp docker/nginx/prod-https.example.conf docker/nginx/prod-https.conf
#   # при необходимости поменяйте домен в prod-https.conf
#
# Запуск из корня репозитория:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.https.yml up -d
#
# !override — полностью заменяет ports/volumes базового compose (см. Compose merge spec).
# Первый выпуск сертификата проще на хосте: certbot (временно без Docker на :80 или standalone).

services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/prod-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
