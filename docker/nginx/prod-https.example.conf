# Пример для продакшена с Let’s Encrypt на хосте.
# 1. Скопируйте: cp docker/nginx/prod-https.example.conf docker/nginx/prod-https.conf
# 2. Подставьте свой домен вместо pinsk-elektrik.by (везде в этом файле).
# 3. Запускайте с docker/docker-compose.https.yml (см. README).
#
# Сертификаты: на хосте в /etc/letsencrypt/live/<домен>/{fullchain.pem,privkey.pem}
# (как после certbot). Не требуются options-ssl-nginx.conf и ssl-dhparams.pem —
# ниже заданы те же по смыслу настройки TLS, иначе nginx часто не стартует без них.

upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name pinsk-elektrik.by www.pinsk-elektrik.by;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pinsk-elektrik.by www.pinsk-elektrik.by;

    ssl_certificate /etc/letsencrypt/live/pinsk-elektrik.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinsk-elektrik.by/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    client_max_body_size 2M;

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
