# Пример для продакшена с Let’s Encrypt на хосте.
# 1. Скопируйте: cp docker/nginx/prod-https.example.conf docker/nginx/prod-https.conf
# 2. Подставьте свой домен вместо pinsk-elektrik.by (везде в этом файле).
# 3. Запускайте с docker-compose.https.yml (см. README).
#
# Сертификаты: на хосте должны лежать в /etc/letsencrypt/ (как после certbot).
# В контейнер они попадают через том :/etc/letsencrypt:ro

upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name pinsk-elektrik.by www.pinsk-elektrik.by;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pinsk-elektrik.by www.pinsk-elektrik.by;

    ssl_certificate /etc/letsencrypt/live/pinsk-elektrik.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinsk-elektrik.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
